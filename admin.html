<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHALLA ADMIN — Do'kon Boshqaruv Ekotizimi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blueCore: {
                            deep: '#030B1E',
                            card: '#081530',
                            primary: '#0047FF',
                            hover: '#0035CC',
                            light: '#38BDF8',
                            border: '#1E2E4E'
                        }
                    },
                    borderRadius: {
                        '3xl': '24px',
                        '4xl': '32px'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030B1E; color: #F8FAFC; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .blue-glow-shadow { box-shadow: 0 10px 30px rgba(0, 71, 255, 0.15); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // FIREBASE BOG'LANISHI
        const firebaseConfig = {
            apiKey: "AIzaSyCWozMUVt_t10aIfPFawhcz-YxZhSFV_Co",
            authDomain: "mahallamarket-ff3fa.firebaseapp.com",
            databaseURL: "https://mahallamarket-ff3fa-default-rtdb.firebaseio.com",
            projectId: "mahallamarket-ff3fa",
            storageBucket: "mahallamarket-ff3fa.firebasestorage.app",
            messagingSenderId: "434195430445",
            appId: "1:434195430445:web:08361e1e2b996df18dcca4"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function App() {
            // 6 TA ASOSIY TIZIM MENYUSI
            const [tab, setTab] = useState("kassa"); // kassa, bor_tovar, yoq_tovar, nasiya, muammolar, hisobot, firmalar
            
            // JONLI MA'LUMOTLAR BAZASI
            const [products, setProducts] = useState([]);
            const [clients, setClients] = useState({});
            const [firms, setFirms] = useState([]);
            const [salesHistory, setSalesHistory] = useState([]);
            const [customIssues, setCustomIssues] = useState([]);
            
            // KASSA SAVATI VA QIDIRUV
            const [cart, setCart] = useState([]);
            const [search, setSearch] = useState("");

            // MODALLAR
            const [priceModal, setPriceModal] = useState({ open: false, product: null, inputVal: "" });
            const [newProductModal, setNewProductModal] = useState(false);
            const [newFirmModal, setNewFirmModal] = useState(false);
            const [newIssueModal, setNewIssueModal] = useState(false);

            // INPUT FORMLAR
            const [pForm, setPForm] = useState({ nom: "", kat: "non", birlik: "dona", kelish: "", sotish: "", qoldiq: "", icon: "🍞" });
            const [fForm, setFForm] = useState({ nom: "", agent: "", tel: "", tovar: "", qarzimiz: "", muddat: "" });
            const [issueText, setIssueText] = useState("");

            // HISOBOT FILTRI
            const [reportPeriod, setReportPeriod] = useState("kunlik"); // kunlik, oylik, yillik

            // FIREBASE'DAN BARCHA BO'LIMLARNI TINGLASH
            useEffect(() => {
                db.ref('products').on('value', snap => {
                    const data = snap.val();
                    if (data) setProducts(Object.keys(data).map(k => ({ ...data[k], key: k })));
                });

                db.ref('clients').on('value', snap => {
                    const data = snap.val();
                    if (data) setClients(data);
                });

                db.ref('firms').on('value', snap => {
                    const data = snap.val();
                    if (data) setFirms(Object.keys(data).map(k => ({ ...data[k], key: k })));
                });

                db.ref('sales').on('value', snap => {
                    const data = snap.val();
                    if (data) setSalesHistory(Object.values(data));
                });

                db.ref('issues').on('value', snap => {
                    const data = snap.val();
                    if (data) setCustomIssues(Object.keys(data).map(k => ({ ...data[k], key: k })));
                });
            }, []);

            // HAR 00:00 DA AVTOMATIK TELEGRAM ACHOT YUBORISH
            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    if (now.getHours() === 0 && now.getMinutes() === 0 && now.getSeconds() <= 2) {
                        sendTelegramReport();
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [salesHistory]);

            const sendTelegramReport = () => {
                const today = new Date().toLocaleDateString('uz-UZ');
                const total = salesHistory.reduce((a, b) => a + b.total, 0);
                const profit = salesHistory.reduce((a, b) => a + b.profit, 0);
                const naqd = salesHistory.filter(s => s.type === 'naqd').reduce((a, b) => a + b.total, 0);
                const karta = salesHistory.filter(s => s.type === 'karta').reduce((a, b) => a + b.total, 0);
                const nasiya = salesHistory.filter(s => s.type === 'nasiya').reduce((a, b) => a + b.total, 0);

                const msg = `📊 KUNLIK YAKUNIY HISOBOT (00:00)%0A📅 Sana: ${today}%0A%0A💰 Jami savdo: ${total.toLocaleString()} so'm%0A💵 Naqd pul: ${naqd.toLocaleString()} so'm%0A💳 Karta: ${karta.toLocaleString()} so'm%0A📝 Nasiya: ${nasiya.toLocaleString()} so'm%0A------------------------%0A📈 Sof foyda: ${profit.toLocaleString()} so'm%0A🛒 Tranzaksiyalar: ${salesHistory.length} ta`;
                window.open(`https://t.me/kundoshlarachot?text=${msg}`, '_blank');
            };

            // SAVDO MANTIQI (DONA VA VAZNLI NARX)
            const handleProductClick = (product) => {
                if (product.birlik === 'kg') {
                    setPriceModal({ open: true, product: product, inputVal: "" });
                } else {
                    const exist = cart.find(i => i.key === product.key && !i.isCustomPrice);
                    if (exist) {
                        setCart(cart.map(i => (i.key === product.key && !i.isCustomPrice) ? { 
                            ...i, qty: i.qty + 1, itemTotal: (i.qty + 1) * i.sotish 
                        } : i));
                    } else {
                        setCart([...cart, { ...product, qty: 1, itemTotal: product.sotish, isCustomPrice: false }]);
                    }
                }
            };

            const confirmCustomPrice = () => {
                const sumInput = parseFloat(priceModal.inputVal);
                if (!sumInput || sumInput <= 0) return alert("Summani to'g'ri kiriting!");
                const p = priceModal.product;
                const calculatedKg = Number((sumInput / p.sotish).toFixed(3));

                setCart([...cart, {
                    ...p,
                    qty: calculatedKg,
                    itemTotal: sumInput,
                    isCustomPrice: true,
                    cartId: Date.now()
                }]);
                setPriceModal({ open: false, product: null, inputVal: "" });
            };

            const totalSum = cart.reduce((acc, i) => acc + i.itemTotal, 0);

            // SAVDONI YAKUNLASH
            const checkout = (type, clientPhone = null) => {
                if (cart.length === 0) return alert("Savat bo'sh!");

                // 1. Firebase qoldiqlarini ayirish
                cart.forEach(c => {
                    const newQoldiq = Number(Math.max(0, (c.qoldiq || 0) - c.qty).toFixed(2));
                    db.ref(`products/${c.key}`).update({
                        qoldiq: newQoldiq,
                        mavjud: newQoldiq > 0
                    });
                });

                // 2. Nasiyaga yozish
                if (type === 'nasiya' && clientPhone) {
                    const cleanPhone = clientPhone.replace(/\s+/g, '');
                    const currentClient = clients[cleanPhone] || { ism: "Nasiyachi", qarz: 0, limit: 100000 };
                    const newDebt = (currentClient.qarz || 0) + totalSum;
                    const xaridMatn = cart.map(c => `${c.nom} (${c.itemTotal.toLocaleString()} so'm)`).join(', ');

                    db.ref(`clients/${cleanPhone}`).update({
                        qarz: newDebt,
                        oxirgiSana: new Date().toISOString().split('T')[0],
                        oxirgiXarid: xaridMatn
                    });
                }

                // 3. Foydani hisoblab bazaga yozish
                const profit = Math.round(cart.reduce((acc, i) => {
                    const kelishSum = (i.kelish || 0) * i.qty;
                    return acc + (i.itemTotal - kelishSum);
                }, 0));

                db.ref('sales').push({
                    date: new Date().toLocaleString(),
                    total: totalSum,
                    profit: profit,
                    type: type,
                    timestamp: Date.now()
                });

                setCart([]);
                alert(`Savdo bajarildi (${type.toUpperCase()})!`);
            };

            // YANGI TOVAR QO'SHISH
            const saveNewProduct = () => {
                if (!pForm.nom || !pForm.sotish) return alert("Nom va narxni to'ldiring!");
                db.ref('products').push({
                    kod: (products.length + 1).toString(),
                    nom: pForm.nom,
                    kat: pForm.kat,
                    birlik: pForm.birlik,
                    kelish: Number(pForm.kelish) || 0,
                    sotish: Number(pForm.sotish) || 0,
                    qoldiq: Number(pForm.qoldiq) || 0,
                    mavjud: (Number(pForm.qoldiq) || 0) > 0,
                    icon: pForm.icon || "📦"
                });
                setNewProductModal(false);
                setPForm({ nom: "", kat: "non", birlik: "dona", kelish: "", sotish: "", qoldiq: "", icon: "🍞" });
            };

            // YANGI FIRMA QO'SHISH
            const saveNewFirm = () => {
                if (!fForm.nom) return alert("Firma nomini kiriting!");
                db.ref('firms').push({
                    nom: fForm.nom,
                    agent: fForm.agent || "Noma'lum",
                    tel: fForm.tel || "-",
                    tovar: fForm.tovar || "Mahsulotlar",
                    qarzimiz: Number(fForm.qarzimiz) || 0,
                    muddat: fForm.muddat || "Belgilanmagan"
                });
                setNewFirmModal(false);
                setFForm({ nom: "", agent: "", tel: "", tovar: "", qarzimiz: "", muddat: "" });
            };

            // QO'LDA MUAMMO YOZISH
            const saveCustomIssue = () => {
                if (!issueText.trim()) return alert("Muammo matnini kiriting!");
                db.ref('issues').push({
                    matn: issueText.trim(),
                    sana: new Date().toLocaleDateString('uz-UZ'),
                    holat: 'ochiq'
                });
                setIssueText("");
                setNewIssueModal(false);
            };

            // AVTOMATIK ANIQLANGAN MUAMMOLAR (SYSTEM ISSUES)
            const overLimitClients = Object.entries(clients).filter(([_, c]) => c.qarz >= (c.limit || 100000));
            const outOfStockItems = products.filter(p => p.qoldiq <= 0);
            const highFirmDebts = firms.filter(f => f.qarzimiz > 500000);

            const filteredProducts = products.filter(p => p.nom.toLowerCase().includes(search.toLowerCase()) || p.kod === search);

            return (
                <div className="min-h-screen flex flex-col bg-blueCore-deep text-slate-100">
                    
                    {/* ASOSIY HEADER & 6 TA TIZIM MENYUSI */}
                    <header className="bg-blueCore-card border-b border-blueCore-border px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-blueCore-primary rounded-2xl flex items-center justify-center font-black text-white text-lg shadow-lg shadow-blue-600/40">
                                ✦
                            </div>
                            <div>
                                <span className="text-xl font-black italic tracking-tighter text-white">MAHALLA <span className="text-blueCore-light">SYSTEM</span></span>
                                <div className="text-[9px] font-extrabold text-emerald-400 uppercase tracking-widest -mt-1">● Boshqaruv & POS Tizimi</div>
                            </div>
                        </div>

                        {/* SIZNING CHIZMAGINGIZDAGI 6 TA BO'LIM TUGMALARI */}
                        <div className="flex gap-1.5 overflow-x-auto no-scrollbar py-1">
                            <button onClick={()=>setTab('kassa')} className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${tab==='kassa'?'bg-blueCore-primary text-white shadow-md shadow-blue-600/30':'bg-blueCore-deep text-slate-300 hover:text-white'}`}>🛒 Kassa (POS)</button>
                            <button onClick={()=>setTab('bor_tovar')} className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${tab==='bor_tovar'?'bg-blueCore-primary text-white shadow-md shadow-blue-600/30':'bg-blueCore-deep text-slate-300 hover:text-white'}`}>📦 Bor Tovar ({products.filter(p=>p.qoldiq>0).length})</button>
                            <button onClick={()=>setTab('yoq_tovar')} className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${tab==='yoq_tovar'?'bg-blueCore-primary text-white shadow-md shadow-blue-600/30':'bg-blueCore-deep text-slate-300 hover:text-white'}`}>⚠️ Yo'q Tovar ({outOfStockItems.length})</button>
                            <button onClick={()=>setTab('nasiya')} className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${tab==='nasiya'?'bg-blueCore-primary text-white shadow-md shadow-blue-600/30':'bg-blueCore-deep text-slate-300 hover:text-white'}`}>📝 Nasiya</button>
                            <button onClick={()=>setTab('muammolar')} className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap relative ${tab==='muammolar'?'bg-rose-600 text-white shadow-md shadow-rose-600/30':'bg-blueCore-deep text-rose-400 hover:text-white'}`}>
                                🚨 Muammolar
                                {(overLimitClients.length + outOfStockItems.length + customIssues.filter(i=>i.holat==='ochiq').length) > 0 && (
                                    <span className="ml-1.5 bg-rose-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-black">
                                        {overLimitClients.length + outOfStockItems.length + customIssues.filter(i=>i.holat==='ochiq').length}
                                    </span>
                                )}
                            </button>
                            <button onClick={()=>setTab('hisobot')} className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${tab==='hisobot'?'bg-blueCore-primary text-white shadow-md shadow-blue-600/30':'bg-blueCore-deep text-slate-300 hover:text-white'}`}>📊 Hisobot (Achot)</button>
                            <button onClick={()=>setTab('firmalar')} className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${tab==='firmalar'?'bg-blueCore-primary text-white shadow-md shadow-blue-600/30':'bg-blueCore-deep text-slate-300 hover:text-white'}`}>🏢 Firmalar</button>
                        </div>
                    </header>

                    {/* ASOSIY ISH MAYDONI */}
                    <main className="flex-1 p-6 max-w-7xl mx-auto w-full">
                        
                        {/* 1. KASSA / POS (TEZKOR SAVDO) */}
                        {tab === 'kassa' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="lg:col-span-2">
                                    <div className="flex gap-3 mb-4">
                                        <input 
                                            type="text" 
                                            placeholder="Mahsulot nomi yoki kodini qidiring..." 
                                            value={search}
                                            onChange={e => setSearch(e.target.value)}
                                            className="flex-1 bg-blueCore-card border border-blueCore-border p-3.5 rounded-2xl text-xs font-bold text-white outline-none focus:border-blueCore-light"
                                        />
                                        <button onClick={()=>setNewProductModal(true)} className="bg-blueCore-primary text-white px-5 rounded-2xl text-xs font-black shadow-lg shadow-blue-600/30">
                                            + Tovar Qo'shish
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 max-h-[580px] overflow-y-auto no-scrollbar pr-1">
                                        {filteredProducts.map(p => (
                                            <div 
                                                key={p.key} 
                                                onClick={() => handleProductClick(p)}
                                                className={`bg-blueCore-card border rounded-3xl p-4 flex flex-col justify-between cursor-pointer transition active:scale-95 ${p.qoldiq > 0 ? 'border-blueCore-border hover:border-blueCore-light blue-glow-shadow' : 'border-rose-900/40 opacity-50'}`}
                                            >
                                                <div>
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-[10px] font-black text-blueCore-light uppercase">KOD: {p.kod}</span>
                                                        <span className="text-[10px] font-black bg-blueCore-deep px-2 py-0.5 rounded-md text-amber-300">
                                                            {p.birlik === 'kg' ? '⚖️ TAROZI' : '1 DONA'}
                                                        </span>
                                                    </div>
                                                    <div className="text-4xl my-2 text-center">{p.icon}</div>
                                                    <h4 className="font-bold text-xs text-white line-clamp-2 leading-snug">{p.nom}</h4>
                                                    <div className="text-[11px] text-slate-400 mt-1">
                                                        1 {p.birlik} narxi: <b className="text-white">{p.sotish.toLocaleString()} so'm</b>
                                                    </div>
                                                </div>
                                                <div className="mt-3 pt-2 border-t border-blueCore-border/50 font-black text-blueCore-light text-xs text-center bg-blueCore-deep/50 py-1.5 rounded-xl">
                                                    {p.birlik === 'kg' ? 'Summa kiritish ➔' : '+1 dona qo\'shish'}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Savat va To'lov */}
                                <div className="bg-blueCore-card border border-blueCore-border rounded-3xl p-5 flex flex-col justify-between h-[640px]">
                                    <div>
                                        <div className="flex justify-between items-center border-b border-blueCore-border pb-3 mb-3">
                                            <h3 className="font-black text-sm text-white uppercase">Joriy Xaridlar</h3>
                                            <button onClick={()=>setCart([])} className="text-[11px] font-bold text-rose-400">Tozalash</button>
                                        </div>

                                        <div className="space-y-2.5 max-h-[360px] overflow-y-auto no-scrollbar">
                                            {cart.map((item, idx) => (
                                                <div key={idx} className="flex justify-between items-center bg-blueCore-deep p-3 rounded-2xl border border-blueCore-border">
                                                    <div>
                                                        <div className="font-bold text-xs text-white">{item.nom}</div>
                                                        <div className="text-[11px] text-slate-400">
                                                            {item.birlik === 'kg' ? `~${item.qty} kg` : `${item.qty} dona`}
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-xs font-black text-blueCore-light">
                                                            {item.itemTotal.toLocaleString()} so'm
                                                        </span>
                                                        <button onClick={()=>setCart(cart.filter((_, i) => i !== idx))} className="w-6 h-6 bg-rose-950 text-rose-400 rounded-lg font-black text-xs">✕</button>
                                                    </div>
                                                </div>
                                            ))}
                                            {cart.length === 0 && <p className="text-xs text-slate-500 text-center py-20 font-semibold">Savat bo'sh.<br/>Mahsulot ustiga bosing.</p>}
                                        </div>
                                    </div>

                                    <div className="border-t border-blueCore-border pt-4">
                                        <div className="flex justify-between items-center mb-4">
                                            <span className="text-xs font-bold text-slate-400 uppercase">Jami To'lov:</span>
                                            <span className="text-2xl font-black text-blueCore-light">{totalSum.toLocaleString()} so'm</span>
                                        </div>

                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={()=>checkout('naqd')} className="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3.5 rounded-2xl text-xs">💵 Naqd</button>
                                            <button onClick={()=>checkout('karta')} className="bg-sky-600 hover:bg-sky-500 text-white font-extrabold py-3.5 rounded-2xl text-xs">💳 Karta</button>
                                            <button onClick={()=>{
                                                let phone = prompt("Mijoz telefon raqami (+998...):", "+998");
                                                if(phone) checkout('nasiya', phone);
                                            }} className="col-span-2 bg-blueCore-primary text-white font-black py-3.5 rounded-2xl text-xs">📝 Nasiyaga Yozish</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2. MAGAZINDAGI BOR TOVARLAR */}
                        {tab === 'bor_tovar' && (
                            <div className="bg-blueCore-card border border-blueCore-border rounded-3xl p-5 shadow-xl">
                                <div className="flex justify-between items-center mb-4">
                                    <div>
                                        <h3 className="font-extrabold text-lg text-white">Magazindagi Bor Tovarlar</h3>
                                        <p className="text-xs text-slate-400">Do'konda mavjud barcha mahsulotlar qoldig'i</p>
                                    </div>
                                    <button onClick={()=>setNewProductModal(true)} className="bg-blueCore-primary text-white text-xs font-bold px-4 py-2.5 rounded-xl">+ Yangi Tovar</button>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                    {products.filter(p => p.qoldiq > 0).map(p => (
                                        <div key={p.key} className="bg-blueCore-deep p-4 rounded-2xl border border-blueCore-border flex justify-between items-center">
                                            <div>
                                                <div className="font-bold text-white text-sm">{p.icon} {p.nom}</div>
                                                <div className="text-xs text-slate-400 mt-1">
                                                    Kelim: {p.kelish.toLocaleString()} | Sotuv: <b className="text-blueCore-light">{p.sotish.toLocaleString()}</b>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-sm font-black text-emerald-400">{p.qoldiq} {p.birlik}</div>
                                                <button onClick={()=>{
                                                    let addQ = prompt(`"${p.nom}" ga qancha qoldiq qo'shmoqchisiz?`);
                                                    if(addQ && !isNaN(addQ)) {
                                                        db.ref(`products/${p.key}`).update({ qoldiq: p.qoldiq + Number(addQ) });
                                                    }
                                                }} className="text-[11px] font-bold text-sky-400 hover:underline mt-1 block">+ Zaxira qo'shish</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 3. YO'Q TOVARLAR */}
                        {tab === 'yoq_tovar' && (
                            <div className="bg-blueCore-card border border-blueCore-border rounded-3xl p-5 shadow-xl">
                                <div className="flex justify-between items-center mb-4">
                                    <div>
                                        <h3 className="font-extrabold text-lg text-rose-400">⚠️ Yo'q / Tugagan Tovarlar Ro'yxati</h3>
                                        <p className="text-xs text-slate-400">Ushbu mahsulotlar zaxirasi tugagan, tezda buyurtma berish kerak</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                    {outOfStockItems.map(p => (
                                        <div key={p.key} className="bg-blueCore-deep p-4 rounded-2xl border border-rose-900/60 flex justify-between items-center">
                                            <div>
                                                <div className="font-bold text-white text-sm">{p.icon} {p.nom}</div>
                                                <div className="text-xs text-rose-400 font-bold mt-1">Zaxira: 0 {p.birlik}</div>
                                            </div>
                                            <button onClick={()=>{
                                                let addQ = prompt(`"${p.nom}" keltirildi! Qancha qoldiq kiritasiz?`);
                                                if(addQ && !isNaN(addQ)) {
                                                    db.ref(`products/${p.key}`).update({ qoldiq: Number(addQ), mavjud: true });
                                                }
                                            }} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-xl">
                                                Keltirildi
                                            </button>
                                        </div>
                                    ))}
                                    {outOfStockItems.length === 0 && <p className="text-sm text-slate-400 py-6">Tugagan mahsulotlar yo'q, hamma tovarlar yetarli.</p>}
                                </div>
                            </div>
                        )}

                        {/* 4. NASIYA DAFTARI */}
                        {tab === 'nasiya' && (
                            <div className="bg-blueCore-card border border-blueCore-border rounded-3xl p-5 shadow-xl">
                                <h3 className="font-extrabold text-lg text-white mb-4">Mijozlar Nasiya Daftari</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {Object.entries(clients).map(([phone, client]) => (
                                        <div key={phone} className="bg-blueCore-deep border border-blueCore-border p-5 rounded-2xl flex justify-between items-center">
                                            <div>
                                                <h4 className="font-bold text-white text-base">{client.ism}</h4>
                                                <p className="text-xs text-slate-400 mt-0.5">Tel: {phone} | Limit: {(client.limit || 100000).toLocaleString()} so'm</p>
                                                <p className="text-[11px] text-blueCore-light mt-1">Oxirgi xarid: {client.oxirgiXarid || "Mavjud emas"}</p>
                                                <div className="text-xl font-black text-blueCore-light mt-2">{(client.qarz || 0).toLocaleString()} so'm</div>
                                            </div>
                                            <button onClick={()=>{
                                                let pay = prompt("Qancha qarz to'landi (so'm)?");
                                                if(pay && !isNaN(pay)) {
                                                    const newQ = Math.max(0, (client.qarz || 0) - Number(pay));
                                                    db.ref(`clients/${phone}`).update({ qarz: newQ });
                                                }
                                            }} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-2xl text-xs font-bold transition">
                                                ✓ Qarz Yopish
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 5. MUAMMOLAR BO'LIMI (TIZIM VA DO'KON MUAMMOLARINI HAL QILISH) */}
                        {tab === 'muammolar' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h3 className="font-extrabold text-lg text-rose-400">🚨 Do'kondagi Barcha Muammolar Markazi</h3>
                                        <p className="text-xs text-slate-400">Tizim aniqlagan va qo'lda kiritilgan muammolarni shu yerdan bartaraf qiling</p>
                                    </div>
                                    <button onClick={()=>setNewIssueModal(true)} className="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-lg shadow-rose-600/30">
                                        + Yangi Muammo Yozish
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    
                                    {/* 1. Limitdan oshgan nasiyalar */}
                                    <div className="bg-blueCore-card border border-rose-900/50 p-5 rounded-3xl">
                                        <h4 className="text-xs font-black uppercase tracking-wider text-rose-400 mb-3">1. Limitdan Oshgan Qarzdorlar</h4>
                                        <div className="space-y-3">
                                            {overLimitClients.map(([phone, c]) => (
                                                <div key={phone} className="bg-blueCore-deep p-3 rounded-xl border border-rose-950">
                                                    <div className="font-bold text-xs text-white">{c.ism} ({phone})</div>
                                                    <div className="text-xs font-black text-rose-400 mt-1">Qarz: {c.qarz.toLocaleString()} so'm (Limit: {(c.limit||100000).toLocaleString()})</div>
                                                </div>
                                            ))}
                                            {overLimitClients.length === 0 && <p className="text-xs text-slate-500">Qoidabuzar qarzdorlar yo'q.</p>}
                                        </div>
                                    </div>

                                    {/* 2. Tugagan tovarlar xabarnomasi */}
                                    <div className="bg-blueCore-card border border-amber-900/50 p-5 rounded-3xl">
                                        <h4 className="text-xs font-black uppercase tracking-wider text-amber-400 mb-3">2. Tugagan Tovarlar</h4>
                                        <div className="space-y-3">
                                            {outOfStockItems.map(p => (
                                                <div key={p.key} className="bg-blueCore-deep p-3 rounded-xl border border-amber-950 flex justify-between items-center">
                                                    <span className="font-bold text-xs text-white">{p.icon} {p.nom}</span>
                                                    <span className="text-[10px] bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded font-black">Tugagan</span>
                                                </div>
                                            ))}
                                            {outOfStockItems.length === 0 && <p className="text-xs text-slate-500">Barcha tovarlar mavjud.</p>}
                                        </div>
                                    </div>

                                    {/* 3. Qo'lda yozilgan eslatma muammolar */}
                                    <div className="bg-blueCore-card border border-blueCore-border p-5 rounded-3xl">
                                        <h4 className="text-xs font-black uppercase tracking-wider text-blueCore-light mb-3">3. Do'kon Eslatmalari & Muammolar</h4>
                                        <div className="space-y-3">
                                            {customIssues.map(issue => (
                                                <div key={issue.key} className="bg-blueCore-deep p-3 rounded-xl border border-blueCore-border flex justify-between items-center">
                                                    <div>
                                                        <div className={`text-xs font-bold ${issue.holat==='bajarildi'?'line-through text-slate-500':'text-white'}`}>{issue.matn}</div>
                                                        <span className="text-[10px] text-slate-400">{issue.sana}</span>
                                                    </div>
                                                    <button onClick={()=>{
                                                        db.ref(`issues/${issue.key}`).update({ holat: issue.holat==='ochiq'?'bajarildi':'ochiq' });
                                                    }} className={`text-xs px-2 py-1 rounded-lg font-bold ${issue.holat==='ochiq'?'bg-emerald-600 text-white':'bg-slate-800 text-slate-400'}`}>
                                                        {issue.holat==='ochiq'?'Hal qilindi':'Qayta ochish'}
                                                    </button>
                                                </div>
                                            ))}
                                            {customIssues.length === 0 && <p className="text-xs text-slate-500">Qo'shimcha muammolar yo'q.</p>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 6. KUNLIK, OYLIK, YILLIK HISOBOT (ACHOT) */}
                        {tab === 'hisobot' && (
                            <div className="space-y-6">
                                <div className="flex flex-wrap justify-between items-center gap-4">
                                    <div>
                                        <h3 className="font-extrabold text-lg text-white">Savdo va Foyda Hisoboti</h3>
                                        <p className="text-xs text-slate-400">Kunlik, oylik va yillik kassa tushumlari</p>
                                    </div>

                                    <div className="flex gap-2">
                                        {['kunlik', 'oylik', 'yillik'].map(p => (
                                            <button 
                                                key={p} 
                                                onClick={()=>setReportPeriod(p)}
                                                className={`px-4 py-2 rounded-xl text-xs font-extrabold uppercase transition ${reportPeriod===p?'bg-blueCore-primary text-white':'bg-blueCore-card text-slate-400'}`}
                                            >
                                                {p} Achot
                                            </button>
                                        ))}
                                        <button onClick={sendTelegramReport} className="bg-sky-600 hover:bg-sky-500 text-white text-xs font-extrabold px-4 py-2 rounded-xl shadow-lg shadow-sky-600/30">
                                            ✈️ @kundoshlarachot ga Yuborish
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div className="bg-blueCore-card border border-blueCore-border p-5 rounded-3xl">
                                        <span className="text-[11px] font-bold text-slate-400 uppercase">Jami Savdo Tushumi</span>
                                        <div className="text-2xl font-black text-blueCore-light mt-1">
                                            {salesHistory.reduce((a,b)=>a+b.total, 0).toLocaleString()} so'm
                                        </div>
                                    </div>
                                    <div className="bg-blueCore-card border border-blueCore-border p-5 rounded-3xl">
                                        <span className="text-[11px] font-bold text-emerald-400 uppercase">Sof Foyda</span>
                                        <div className="text-2xl font-black text-emerald-400 mt-1">
                                            {salesHistory.reduce((a,b)=>a+b.profit, 0).toLocaleString()} so'm
                                        </div>
                                    </div>
                                    <div className="bg-blueCore-card border border-blueCore-border p-5 rounded-3xl">
                                        <span className="text-[11px] font-bold text-slate-400 uppercase">Naqd Pul</span>
                                        <div className="text-2xl font-black text-white mt-1">
                                            {salesHistory.filter(s=>s.type==='naqd').reduce((a,b)=>a+b.total, 0).toLocaleString()} so'm
                                        </div>
                                    </div>
                                    <div className="bg-blueCore-card border border-blueCore-border p-5 rounded-3xl">
                                        <span className="text-[11px] font-bold text-sky-400 uppercase">Karta / Click</span>
                                        <div className="text-2xl font-black text-sky-400 mt-1">
                                            {salesHistory.filter(s=>s.type==='karta').reduce((a,b)=>a+b.total, 0).toLocaleString()} so'm
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 7. FIRMALAR */}
                        {tab === 'firmalar' && (
                            <div className="bg-blueCore-card border border-blueCore-border rounded-3xl p-5 shadow-xl">
                                <div className="flex justify-between items-center mb-4">
                                    <div>
                                        <h3 className="font-extrabold text-lg text-white">Firmalar & Yetkazib Beruvchilar</h3>
                                        <p className="text-xs text-slate-400">Bizning firmalardan qarzlarimiz va to'lov muddatlari</p>
                                    </div>
                                    <button onClick={()=>setNewFirmModal(true)} className="bg-blueCore-primary text-white text-xs font-bold px-4 py-2.5 rounded-xl">+ Yangi Firma</button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {firms.map(f => (
                                        <div key={f.key} className="bg-blueCore-deep border border-blueCore-border p-5 rounded-2xl flex justify-between items-center">
                                            <div>
                                                <h4 className="font-bold text-white text-base">{f.nom}</h4>
                                                <p className="text-xs text-slate-400 mt-0.5">Agent: {f.agent} ({f.tel})</p>
                                                <p className="text-xs text-blueCore-light mt-1">Yetkazadi: {f.tovar}</p>
                                                <div className="text-lg font-black text-amber-400 mt-2">Qarzimiz: {(f.qarzimiz || 0).toLocaleString()} so'm</div>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-[10px] font-bold bg-amber-500/20 text-amber-400 px-2 py-1 rounded-md block mb-3">Muddat: {f.muddat}</span>
                                                <button onClick={()=>{
                                                    let p = prompt("Firmaga qancha qarz to'landi?");
                                                    if(p && !isNaN(p)) {
                                                        const newQ = Math.max(0, (f.qarzimiz || 0) - Number(p));
                                                        db.ref(`firms/${f.key}`).update({ qarzimiz: newQ });
                                                    }
                                                }} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-xl">To'landik</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* VAZN / SUMMA NUMPAD MODALI */}
                    {priceModal.open && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-blueCore-card border border-blueCore-border rounded-4xl max-w-xs w-full p-6 text-center shadow-2xl">
                                <div className="text-4xl mb-1">{priceModal.product.icon}</div>
                                <h3 className="text-base font-black text-white">{priceModal.product.nom}</h3>
                                <p className="text-xs text-slate-400 mb-3">1 kg: {priceModal.product.sotish.toLocaleString()} so'm</p>

                                <div className="bg-blueCore-deep border-2 border-blueCore-light p-3.5 rounded-2xl mb-4 text-center">
                                    <span className="text-2xl font-black text-white">{priceModal.inputVal ? Number(priceModal.inputVal).toLocaleString() : "0"}</span>
                                    <span className="text-xs font-bold text-slate-400 ml-1">so'm</span>
                                </div>

                                <div className="grid grid-cols-3 gap-2 mb-4">
                                    {[1, 2, 3, 4, 5, 6, 7, 8, 9, '000', 0, 'C'].map((btn) => (
                                        <button
                                            key={btn}
                                            onClick={() => {
                                                if (btn === 'C') setPriceModal({ ...priceModal, inputVal: "" });
                                                else setPriceModal({ ...priceModal, inputVal: priceModal.inputVal + btn.toString() });
                                            }}
                                            className="bg-blueCore-deep hover:bg-slate-800 border border-blueCore-border text-white font-black py-3 rounded-xl text-base transition active:scale-95"
                                        >
                                            {btn}
                                        </button>
                                    ))}
                                </div>

                                <div className="flex gap-2">
                                    <button onClick={() => setPriceModal({ open: false, product: null, inputVal: "" })} className="flex-1 bg-slate-800 text-slate-300 py-3 rounded-xl font-bold text-xs">Bekor</button>
                                    <button onClick={confirmCustomPrice} className="flex-1 bg-blueCore-primary text-white py-3 rounded-xl font-black text-xs shadow-lg shadow-blue-600/40">Savatga Urish</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TOVAR QO'SHISH MODALI */}
                    {newProductModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-blueCore-card border border-blueCore-border rounded-4xl max-w-sm w-full p-6 text-xs">
                                <h3 className="text-base font-black text-white mb-3">Yangi Tovar Qo'shish</h3>
                                <input type="text" placeholder="Tovar nomi" value={pForm.nom} onChange={e=>setPForm({...pForm, nom: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white mb-2 outline-none" />
                                <div className="grid grid-cols-2 gap-2 mb-2">
                                    <select value={pForm.birlik} onChange={e=>setPForm({...pForm, birlik: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white outline-none font-bold">
                                        <option value="dona">Dona</option>
                                        <option value="kg">Kg (Tarozili)</option>
                                    </select>
                                    <select value={pForm.kat} onChange={e=>setPForm({...pForm, kat: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white outline-none font-bold">
                                        <option value="non">Non & Pishiriq</option>
                                        <option value="sabzavot">Sabzavot / Meva</option>
                                        <option value="qandolat">Qandolat & Shakar</option>
                                        <option value="gigiyena">Yuvish vositasi</option>
                                    </select>
                                </div>
                                <div className="grid grid-cols-2 gap-2 mb-2">
                                    <input type="number" placeholder="Kelim narxi" value={pForm.kelish} onChange={e=>setPForm({...pForm, kelish: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white outline-none" />
                                    <input type="number" placeholder="Sotish narxi" value={pForm.sotish} onChange={e=>setPForm({...pForm, sotish: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white outline-none" />
                                </div>
                                <div className="grid grid-cols-2 gap-2 mb-4">
                                    <input type="number" placeholder="Soni / Kg miqdori" value={pForm.qoldiq} onChange={e=>setPForm({...pForm, qoldiq: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white outline-none" />
                                    <input type="text" placeholder="Emoji (🍞, 🥔, 🍬)" value={pForm.icon} onChange={e=>setPForm({...pForm, icon: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white text-center outline-none" />
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={()=>setNewProductModal(false)} className="flex-1 bg-slate-800 text-slate-300 py-3 rounded-xl font-bold">Bekor</button>
                                    <button onClick={saveNewProduct} className="flex-1 bg-blueCore-primary text-white py-3 rounded-xl font-black">Saqlash</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FIRMA QO'SHISH MODALI */}
                    {newFirmModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-blueCore-card border border-blueCore-border rounded-4xl max-w-sm w-full p-6 text-xs">
                                <h3 className="text-base font-black text-white mb-3">Yangi Firma Qo'shish</h3>
                                <input type="text" placeholder="Firma nomi" value={fForm.nom} onChange={e=>setFForm({...fForm, nom: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white mb-2 outline-none" />
                                <input type="text" placeholder="Agent ismi" value={fForm.agent} onChange={e=>setFForm({...fForm, agent: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white mb-2 outline-none" />
                                <input type="tel" placeholder="Telefon raqami" value={fForm.tel} onChange={e=>setFForm({...fForm, tel: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white mb-2 outline-none" />
                                <input type="text" placeholder="Yetkazadigan tovari" value={fForm.tovar} onChange={e=>setFForm({...fForm, tovar: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white mb-2 outline-none" />
                                <div className="grid grid-cols-2 gap-2 mb-4">
                                    <input type="number" placeholder="Boshlang'ich qarz" value={fForm.qarzimiz} onChange={e=>setFForm({...fForm, qarzimiz: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white outline-none" />
                                    <input type="date" value={fForm.muddat} onChange={e=>setFForm({...fForm, muddat: e.target.value})} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white outline-none" />
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={()=>setNewFirmModal(false)} className="flex-1 bg-slate-800 text-slate-300 py-3 rounded-xl font-bold">Bekor</button>
                                    <button onClick={saveNewFirm} className="flex-1 bg-blueCore-primary text-white py-3 rounded-xl font-black">Saqlash</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MUAMMO YOZISH MODALI */}
                    {newIssueModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-blueCore-card border border-blueCore-border rounded-4xl max-w-sm w-full p-6 text-xs">
                                <h3 className="text-base font-black text-white mb-3">Do'kon Muammosi / Eslatma</h3>
                                <textarea rows="3" placeholder="Masalan: Bek Ota firmasiga 500 000 so'm berish kerak yoki sovutgichni tuzatish kerak..." value={issueText} onChange={e=>setIssueText(e.target.value)} className="w-full bg-blueCore-deep border border-blueCore-border p-3 rounded-xl text-white mb-4 outline-none"></textarea>
                                <div className="flex gap-2">
                                    <button onClick={()=>setNewIssueModal(false)} className="flex-1 bg-slate-800 text-slate-300 py-3 rounded-xl font-bold">Bekor</button>
                                    <button onClick={saveCustomIssue} className="flex-1 bg-rose-600 text-white py-3 rounded-xl font-black">Saqlash</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
